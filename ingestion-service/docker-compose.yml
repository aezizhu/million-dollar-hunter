version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ingestion
    ports:
      - "5433:5432"
  redis:
    image: redis:7
    ports:
      - "6380:6379"
  wiremock:
    image: wiremock/wiremock:3.7.0
    command: ["--verbose"]
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8080:8080"
