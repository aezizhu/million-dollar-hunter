title = "gitleaks configuration for Million Dollar Hunter (pinned to gitleaks 8.24.3)" # (important-comment)
# Rules: using stock rules from gitleaks 8.24.3; add custom rules below if needed. # (important-comment)

[allowlist]
description = "Scoped allowlist for known benign files; no blanket directories" # (important-comment)
paths = [
  "^monitoring/grafana/auth-slo-dashboard\\.json$", # why: Prometheus/Grafana queries trigger detectors; no secrets. added-by: Devin AI; review-by: 2026-01-15 # (important-comment)
  "^monitoring/prometheus/alerting-rules\\.yaml$",  # why: Alert expressions look like tokens; config only. added-by: Devin AI; review-by: 2026-01-15 # (important-comment)
  "^monitoring/prometheus/recording-rules\\.yaml$" # why: Recording rules contain query fragments; no credentials. added-by: Devin AI; review-by: 2026-01-15 # (important-comment)
]

