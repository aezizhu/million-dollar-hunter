syntax = "proto3";

package portfolio.v1;

option go_package = "github.com/aezizhu/million-dollar-hunter/services/portfolio-service/proto/portfolio/v1;v1";

service PortfolioService {
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse);
  rpc GetPortfolioSummary(GetPortfolioSummaryRequest) returns (GetPortfolioSummaryResponse);
  rpc GetWalletDetails(GetWalletDetailsRequest) returns (GetWalletDetailsResponse);
  rpc GetTransactionHistory(GetTransactionHistoryRequest) returns (GetTransactionHistoryResponse);
  rpc Export(ExportRequest) returns (ExportResponse);
}

message GetPortfolioRequest {
  string wallet_id = 1;
}

message Asset {
  string token_address = 1;
  string symbol = 2;
  string name = 3;
  string amount = 4;
  double usd_value = 5;
}

message GetPortfolioResponse {
  string wallet_id = 1;
  repeated Asset assets = 2;
  double total_usd_value = 3;
}

enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  EXPORT_FORMAT_CSV = 1;
  EXPORT_FORMAT_JSON = 2;
}

message ExportRequest {
  string user_id = 1;
  string wallet_id = 2;
  ExportFormat format = 3;
}

message ExportResponse {
  string path = 1;
}

message Wallet {
  string id = 1;
  string address = 2;
  string chain = 3;
  double total_usd_value = 4;
  int32 asset_count = 5;
}

message GetPortfolioSummaryRequest {
  string user_id = 1;
}

message GetPortfolioSummaryResponse {
  repeated Wallet wallets = 1;
  double total_net_worth = 2;
}

message GetWalletDetailsRequest {
  string wallet_id = 1;
  string address = 2;
}

message GetWalletDetailsResponse {
  string wallet_id = 1;
  string address = 2;
  string chain = 3;
  repeated Asset assets = 4;
  double total_usd_value = 5;
}

message Transaction {
  string hash = 1;
  string from = 2;
  string to = 3;
  string amount = 4;
  string symbol = 5;
  string token_address = 6;
  int64 timestamp = 7;
  string type = 8;
}

message GetTransactionHistoryRequest {
  string wallet_id = 1;
  string address = 2;
  int32 page = 3;
  int32 limit = 4;
  string filter_by_type = 5;
}

message GetTransactionHistoryResponse {
  repeated Transaction transactions = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 limit = 4;
}
