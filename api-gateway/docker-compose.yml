version: '3.8'

services:
  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_EXPIRY_MINUTES=15
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - RATE_LIMIT_PER_MINUTE=100
      - RATE_LIMIT_BURST=200
      - LOG_LEVEL=info
      - MVP_USERNAME=aezi
      - MVP_PASSWORD=Aa@123456789
    depends_on:
      - redis
    networks:
      - million-hunter

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - million-hunter

volumes:
  redis-data:

networks:
  million-hunter:
    driver: bridge
