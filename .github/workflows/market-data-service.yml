name: Market Data Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/market-data-service/**'
      - '.github/workflows/market-data-service.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/market-data-service/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_data_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Install dependencies
      working-directory: services/market-data-service
      run: |
        go mod download
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run migrations
      working-directory: services/market-data-service
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: market_data_test
      run: |
        go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
        migrate -path db/migrations -database "postgres://postgres:postgres@localhost:5432/market_data_test?sslmode=disable" up

    - name: Run linter
      working-directory: services/market-data-service
      run: golangci-lint run ./...

    - name: Run unit tests
      working-directory: services/market-data-service
      run: go test ./internal/... -v -race -coverprofile=coverage.txt -covermode=atomic

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./services/market-data-service/coverage.txt
        flags: market-data-service

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build binary
      working-directory: services/market-data-service
      run: |
        go build -v -o bin/market-data-service ./cmd/market-data-service

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      working-directory: services/market-data-service
      run: docker build -t market-data-service:${{ github.sha }} .

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Start services
      working-directory: services/market-data-service
      run: docker compose up -d

    - name: Wait for services
      run: sleep 10

    - name: Run integration tests
      working-directory: services/market-data-service
      run: go test ./tests -v -run Integration -timeout 5m

    - name: Stop services
      working-directory: services/market-data-service
      if: always()
      run: docker compose down
