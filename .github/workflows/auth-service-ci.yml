name: Auth Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-ci.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: services/auth-service/go.sum

    - name: Install dependencies
      working-directory: services/auth-service
      run: |
        go mod download
        go mod verify

    - name: Run migrations
      working-directory: services/auth-service
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_test?sslmode=disable
        GOWORK: "off"
      run: |
        go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
        migrate -path db/migrations -database "$DATABASE_URL" up
        echo "Verifying migration state..."
        migrate -path db/migrations -database "$DATABASE_URL" version

    - name: Run unit tests
      working-directory: services/auth-service
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_test?sslmode=disable
        JWT_SIGNING_KEY: test-key-for-ci
        ENABLE_MULTI_USER: "true"
        GOWORK: "off"
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Generate coverage report
      working-directory: services/auth-service
      env:
        GOWORK: "off"
      run: go tool cover -func=coverage.out

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./services/auth-service/coverage.out
        flags: auth-service
      continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: services/auth-service/go.sum

    - name: Install golangci-lint
      working-directory: services/auth-service
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run linter
      working-directory: services/auth-service
      run: golangci-lint run --config .golangci.yml ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: services/auth-service/go.sum

    - name: Install dependencies
      working-directory: services/auth-service
      run: go mod download

    - name: Build binary
      working-directory: services/auth-service
      env:
        GOWORK: "off"
      run: go build -v -o bin/auth-service ./cmd/auth-service

    - name: Verify binary
      working-directory: services/auth-service
      run: |
        if [ ! -f bin/auth-service ]; then
          echo "Binary not created"
          exit 1
        fi
        file bin/auth-service

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: services/auth-service/go.sum

    - name: Run Gosec Security Scanner
      working-directory: services/auth-service
      env:
        GOWORK: "off"
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt=json -out=gosec-results.json ./... || true
        gosec -fmt=text ./... || true
      continue-on-error: true  # Gosec findings are informational, not blocking

    - name: Upload Gosec results
      uses: actions/upload-artifact@v4
      with:
        name: gosec-results
        path: services/auth-service/gosec-results.json
      if: always()

    - name: Check for known vulnerabilities
      working-directory: services/auth-service
      env:
        GOWORK: "off"
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
      continue-on-error: true  # TODO: Go 1.21 has known stdlib vulnerabilities, upgrade to Go 1.22+ to fix

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: |
          gitleaks detect --redact --report-format json --report-path gitleaks-report.json


      - name: Install truffleHog
        run: |
          python3 -m pip install --user truffleHog

      - name: Run truffleHog
        run: |
          ~/.local/bin/trufflehog filesystem --json . > trufflehog-report.json

      - name: Upload secret scan reports
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: |
            gitleaks-report.json
            trufflehog-report.json
