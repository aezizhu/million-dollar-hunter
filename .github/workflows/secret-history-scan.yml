name: Secret History Scan

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  history-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks on history (JSON)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          gitleaks detect --repo-url "$REPO_URL" --log-opts="--since='14 days ago'" --redact -c .gitleaks.toml --report-format json --report-path gitleaks-history.json

      - name: Run gitleaks on history (SARIF)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          gitleaks detect --repo-url "$REPO_URL" --log-opts="--since='14 days ago'" --redact -c .gitleaks.toml --report-format sarif --report-path gitleaks-history.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-history.sarif

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-secret-scan-reports
          path: |
            gitleaks-history.json
            gitleaks-history.sarif
