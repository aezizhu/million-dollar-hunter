name: API Gateway CI

on:
  pull_request:
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"
  push:
    branches:
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go mod download
        run: go mod download

      - name: Build
        run: GOWORK=off go build ./...

      - name: Vet
        run: GOWORK=off go vet ./...

      - name: Test
        run: GOWORK=off go test -race -count=1 ./...
