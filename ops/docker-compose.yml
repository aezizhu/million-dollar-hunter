version: "3.9"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.4
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-postgres:
    image: postgres:16-alpine
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
      POSTGRES_DB: ingestion
    volumes:
      - ingestion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    ports: ["5435:5432"]
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../
      dockerfile: services/auth-service/Dockerfile
    restart: on-failure
    environment:
      PORT: "8081"
      GRPC_PORT: "50051"
      DATABASE_URL: "postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable"
      JWT_ISSUER: "million-hunter"
      JWT_AUDIENCE: "million-hunter-client"
      JWT_SIGNING_KEY: "${JWT_SECRET:-devsecret123}"
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_HOURS: "168"
      ENABLE_MULTI_USER: "false"
      PASSWORD_MIN_LENGTH: "12"
      LOCKOUT_AFTER_FAILS: "3"
      LOCKOUT_WINDOW_MIN: "15"
      LOCKOUT_DURATION_MIN: "15"
      MVP_USERNAME: "aezi"
      MVP_PASSWORD: "Aa@123456789"
    depends_on:
      auth-postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  market-data-service:
    build:
      context: ../
      dockerfile: services/market-data-service/Dockerfile
    restart: on-failure
    environment:
      GRPC_PORT: "50052"
      DB_HOST: ""  # Empty = Redis-only mode (no database dependency)
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_TTL: "60s"
      COINGECKO_API_KEY: "${COINGECKO_API_KEY:-}"
      COINGECKO_BASE_URL: "https://api.coingecko.com/api/v3"
      PRICE_CACHE_TTL: "60"
      WORKER_ENABLED: "true"
      WORKER_REFRESH_INTERVAL: "30s"
      WORKER_BATCH_SIZE: "50"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "50052:50052"
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q :$$GRPC_PORT"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion-service:
    build:
      context: ../
      dockerfile: ingestion-service/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: "postgres://ingestion:ingestion@ingestion-postgres:5432/ingestion?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_TX_INGESTED: "TransactionDataIngested"
      HTTP_PORT: "8090"
      ALCHEMY_BASE_URL: "${ALCHEMY_BASE_URL:-https://api.alchemy.com}"
      ALCHEMY_API_KEY: "${ALCHEMY_API_KEY:-}"
      MORALIS_BASE_URL: "${MORALIS_BASE_URL:-https://deep-index.moralis.io/api/v2.2}"
      MORALIS_API_KEY: "${MORALIS_API_KEY:-}"
      USE_API_MOCKS: "false"
    depends_on:
      kafka:
        condition: service_healthy
      ingestion-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  portfolio-service:
    build:
      context: ../
      dockerfile: services/portfolio-service/Dockerfile
    restart: on-failure
    environment:
      GRPC_ADDR: ":8082"
      DATABASE_URL: "postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable"
      KAFKA_BROKERS: "kafka:29092"
      TOPIC_TRANSACTION_INGESTED: "TransactionDataIngested"
      TOPIC_PORTFOLIO_UPDATED: "PortfolioUpdated"
      KAFKA_GROUP_ID: "portfolio-service"
      EXPORT_DIR: "/data/exports"
      MARKET_DATA_SERVICE_ADDR: "market-data-service:50052"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - exports:/data/exports

  api-gateway:
    build:
      context: ../
      dockerfile: api-gateway/Dockerfile
    restart: on-failure
    environment:
      PORT: "8080"
      REDIS_URL: "redis:6379"
      AUTH_MODE: "mvp-gate"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      PORTFOLIO_SERVICE_URL: "portfolio-service:8082"
      MARKET_DATA_SERVICE_URL: "market-data-service:50052"
      AUTH_VALIDATE_MODE: "grpc"
      AUTH_GRPC_ADDR: "auth-service:50051"
      JWT_AUDIENCE: "million-hunter-client"
      AUTH_GRPC_TIMEOUT_MS: "2000"
      JWT_SECRET: "${JWT_SECRET:-devsecret123}"
      FRONTEND_URL: "http://localhost:3000"
      PROMETHEUS_NAMESPACE: "api_gateway"
      STRICT_OPENAPI_VALIDATION: "false"
      RATE_DEFAULT_RPS: "10"
      RATE_DEFAULT_BURST: "20"
    depends_on:
      auth-service:
        condition: service_healthy
      portfolio-service:
        condition: service_started
      market-data-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  ingestion_pgdata:
  auth_pgdata:
  exports:
