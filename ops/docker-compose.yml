version: "3.9"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.5.4
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data

  ingestion-postgres:
    image: postgres:16-alpine
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
      POSTGRES_DB: ingestion
    volumes:
      - ingestion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  ingestion-service:
    build:
      context: ../
      dockerfile: ingestion-service/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: "postgres://ingestion:ingestion@ingestion-postgres:5432/ingestion?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_TX_INGESTED: "TransactionDataIngested"
      HTTP_PORT: "8090"
      ALCHEMY_BASE_URL: "${ALCHEMY_BASE_URL:-https://api.alchemy.com}"
      ALCHEMY_API_KEY: "${ALCHEMY_API_KEY:-}"
      MORALIS_BASE_URL: "${MORALIS_BASE_URL:-https://deep-index.moralis.io/api/v2.2}"
      MORALIS_API_KEY: "${MORALIS_API_KEY:-}"
      USE_API_MOCKS: "false"
    depends_on:
      kafka:
        condition: service_started
      ingestion-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/healthz", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  portfolio-service:
    build:
      context: ../
      dockerfile: services/portfolio-service/Dockerfile
    restart: on-failure
    environment:
      GRPC_ADDR: ":8081"
      DATABASE_URL: "postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable"
      KAFKA_BROKERS: "kafka:29092"
      TOPIC_TRANSACTION_INGESTED: "TransactionDataIngested"
      TOPIC_PORTFOLIO_UPDATED: "PortfolioUpdated"
      KAFKA_GROUP_ID: "portfolio-service"
      EXPORT_DIR: "/data/exports"
    depends_on:
      - kafka
      - postgres
      - ingestion-service
    ports:
      - "8081:8081"
    volumes:
      - exports:/data/exports

volumes:
  pgdata:
  ingestion_pgdata:
  exports:
