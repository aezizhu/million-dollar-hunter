version: "3.9"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.5.4
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data

  portfolio-service:
    build:
      context: ../
      dockerfile: services/portfolio-service/Dockerfile
    environment:
      GRPC_ADDR: ":8081"
      DATABASE_URL: "postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable"
      KAFKA_BROKERS: "kafka:29092"
      TOPIC_TRANSACTION_INGESTED: "TransactionDataIngested"
      TOPIC_PORTFOLIO_UPDATED: "PortfolioUpdated"
      KAFKA_GROUP_ID: "portfolio-service"
      EXPORT_DIR: "/data/exports"
    depends_on:
      - kafka
      - postgres
    ports:
      - "8081:8081"
    volumes:
      - exports:/data/exports

volumes:
  pgdata:
  exports:
